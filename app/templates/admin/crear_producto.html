{% extends 'base.html' %}

{% block title %}
    {% if producto %}Editar producto{% else %}Crear producto{% endif %} - Admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4">
                    {% if producto %}Editar producto{% else %}Crear producto{% endif %}
                </h3>

                <form method="POST" enctype="multipart/form-data">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Nombre</label>
                            <input type="text" name="nombre" class="form-control" value="{{ producto.nombre if producto else '' }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Categoría</label>
                            <select name="categoria_id" class="form-select" required>
                                <option value="">Selecciona una categoría</option>
                                {% for categoria in categorias %}
                                    <option value="{{ categoria.id }}" {% if producto and producto.categoria_id == categoria.id %}selected{% endif %}>{{ categoria.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Descripción</label>
                            <textarea name="descripcion" class="form-control" rows="3">{{ producto.descripcion if producto else '' }}</textarea>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Precio</label>
                            <input type="number" step="0.01" min="0" name="precio" class="form-control" value="{{ producto.precio if producto else '' }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Stock</label>
                            <input type="number" min="0" name="stock" class="form-control" value="{{ producto.stock if producto else 0 }}" required>
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="activo" {% if producto and producto.activo %}checked{% elif not producto %}checked{% endif %}>
                                <label class="form-check-label">Producto activo</label>
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Imagen</label>
                            <input type="file" name="imagen" class="form-control" accept="image/*">
                            {% if producto and producto.imagen %}
                                <div class="mt-2">
                                    <img src="{{ url_for('static', filename=producto.imagen_url) }}" alt="Imagen actual" class="img-thumbnail" style="max-height: 120px;">
                                </div>
                            {% endif %}
                        </div>
                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-success">Guardar</button>
                        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
