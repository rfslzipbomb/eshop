{% extends 'base.html' %}

{% block title %}
    {% if categoria %}Editar categoría{% else %}Crear categoría{% endif %} - Admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4">
                    {% if categoria %}Editar categoría{% else %}Crear categoría{% endif %}
                </h3>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" name="nombre" class="form-control" value="{{ categoria.nombre if categoria else '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea name="descripcion" class="form-control" rows="3">{{ categoria.descripcion if categoria else '' }}</textarea>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="activa" {% if categoria and categoria.activa %}checked{% elif not categoria %}checked{% endif %}>
                        <label class="form-check-label">Categoría activa</label>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">Guardar</button>
                        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
